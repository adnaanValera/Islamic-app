name: Nooriva daily notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Nooriva notification cycle
        env:
          REMINDER_URL: ${{ secrets.NOORIVA_PRAYER_REMINDER_URL }}
          SITE_URL: ${{ secrets.NOORIVA_SITE_URL }}
          CRON_SECRET: ${{ secrets.NOORIVA_CRON_SECRET }}
        run: |
          BASE_URL="$REMINDER_URL"

          if [ -z "$BASE_URL" ] && [ -n "$SITE_URL" ]; then
            BASE_URL="${SITE_URL%/}/api/push-send"
          fi

          if [ -z "$BASE_URL" ]; then
            echo "Set NOORIVA_PRAYER_REMINDER_URL or NOORIVA_SITE_URL"
            exit 1
          fi

          BASE_URL="$(printf '%s' "$BASE_URL" | sed 's#/api/push-send-prayer-reminders#/api/push-send#')"
          BASE_URL="$(printf '%s' "$BASE_URL" | sed 's#?mode=.*$##')"

          PRAYER_URL="${BASE_URL}?mode=prayer&window=10"
          AYAH_URL="${BASE_URL}?mode=ayah"

          echo "Triggering $PRAYER_URL"
          curl --fail-with-body \
            -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$PRAYER_URL"

          echo "Triggering $AYAH_URL"
          curl --fail-with-body \
            -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$AYAH_URL"
