<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nooriva | Dua</title>
    <meta
      name="description"
      content="Search Nooriva's full dua collection in Arabic and English with a clean mobile reading layout."
    />
    <meta name="theme-color" content="#F9F6F0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell page-shell-prayer">
      <header class="site-header prayer-mobile-header">
        <div class="brand-lockup">
          <a href="./index.html" aria-label="Back to Nooriva home">
            <img class="brand-logo" src="./assets/nooriva-logo-transparent.png" alt="Nooriva logo" />
          </a>
        </div>
        <nav class="site-nav">
          <a href="./index.html">Home</a>
          <a href="./prayer.html">Prayer</a>
          <a href="./qibla.html">Qibla</a>
          <a href="./quran.html">Quran</a>
          <a href="./dua.html" aria-current="page">Dua</a>
          <a href="./tasbeeh.html">Tasbeeh</a>
          <a href="./account.html">Account</a>
          <a href="./settings.html">Help</a>
        </nav>
      </header>

      <main class="prayer-page">
        <section class="prayer-table-card prayer-table-card-hero quran-reader-shell quran-reader-shell-premium dua-shell">
          <div class="quran-reader-toolbar dua-toolbar">
            <div class="quran-reader-toolbar-top dua-toolbar-top">
              <div class="dua-heading-block">
                <p class="eyebrow">Dua</p>
                <h1 class="prayer-hero-title">Search the full dua collection.</h1>
              </div>
            </div>

            <div class="quran-reader-toolbar-bottom dua-toolbar-bottom">
              <div class="quran-toolbar-search">
                <input
                  class="quran-search-input"
                  id="dua-search"
                  type="search"
                  placeholder="Search dua name or keyword"
                  autocomplete="off"
                />
              </div>
              <button class="dua-favorites-toggle" id="dua-favorites-toggle" type="button">Favorites</button>
            </div>
          </div>

          <div class="quran-reader-header quran-reader-header-premium quran-reader-header-minimal dua-header">
            <div class="status-stack">
              <p class="status-line" id="dua-status">Loading duas...</p>
            </div>
          </div>

          <div class="dua-category-row" id="dua-category-row"></div>

          <div class="dua-list" id="dua-list">
            <article class="dua-card">
              <div class="dua-card-summary">
                <strong>Loading</strong>
              </div>
            </article>
          </div>
        </section>

        <nav class="mobile-bottom-nav home-mobile-bottom-nav" aria-label="Mobile navigation">
          <a href="./index.html">Home</a>
          <a href="./prayer.html">Prayer</a>
          <a href="./qibla.html">Qibla</a>
          <a href="./quran.html">Quran</a>
          <a href="./dua.html" aria-current="page">Dua</a>
          <a href="./tasbeeh.html">Tasbeeh</a>
          <a href="./account.html">Account</a>
          <a href="./settings.html">Help</a>
        </nav>
      </main>
    </div>

    <script src="./install-app.js"></script>
    <script src="./mobile-nav.js"></script>
    <script src="./dua.js"></script>
  </body>
</html>
